function snap(list){

 for(let i=0;i<5;i++){
  const day=DAYS[di],L=list.filter(o=>o.day===day).sort(byTime);

 <section class="panel"><p class="lbl">Shift hours <span>start and end</span></p><div class="tm"><input type="time" data-a="ss" value="${x.s}" aria-label="Shift start"><span>to</span><input type="time" data-a="se" value="${x.e}" aria-label="Shift end"></div>
  <p class="mu" style="margin:8px 0 0">Only lessons inside this window are counted as yours.</p></section>
 <section class="panel"><p class="lbl">Subjects &amp; classes</p>
  ${x.lines.map((l,i)=>`<div class="line"><span>${l.sub} · ${l.cls.length===1?"Class ":"Classes "}${l.cls.join(", ")}</span><span class="ac"><button data-a="rmline" data-v="${i}" aria-label="Remove">✕</button></span></div>`).join("")}
  <p class="lbl" style="margin-top:10px">Subjects <span>pick one or more</span></p><div class="row wr">${SUBS.filter(s=>!/Test|Worship|P\.E/.test(s)).map(s=>chip(s,E.ps.has(s),"psub",s)).join("")}</div>
  <p class="lbl" style="margin-top:12px">Classes <span>pick one or more</span></p><div class="row wr">${CLASSES.map(c=>chip(c,E.pc.has(c),"pcls",c)).join("")}</div>
  <div style="margin-top:12px"><button class="btn" data-a="addline" ${ps.length&&pc.length?"":"disabled"}>Add ${ps.length>1?ps.length+" subjects":ps[0]||"subjects"}${pc.length?" to "+(pc.length===1?"Class ":"Classes ")+pc.join(", "):""}</button></div></section>
 ${err?`<p class="err">${esc(err)}</p>`:""}
 <button class="btn" style="width:100%" data-a="sdone">Done</button></div>`}
function sheetView(){
 if(E.sc)return schedView();
 const d=E,ok=d.schedules.length>0&&!busy;
 return `<div class="in"><div class="sh"><b>Teaching profile</b><button class="ic" data-a="close">Close</button></div>
 <section class="panel"><p class="lbl">Your name <span>optional</span></p><input type="text" data-a="name" value="${esc(d.name)}" placeholder="e.g. Mr. Mensah" maxlength="40" autocomplete="name"></section>
 <section class="panel"><p class="lbl">Schedules <span>each has its own days, shift &amp; subjects</span></p>
  ${d.schedules.map((x,i)=>`<div class="line"><span><b>${esc(x.label)}</b><small>${dayTxt(x)} · ${f12(x.shift.s)}–${f12(x.shift.e)}</small><small>${x.lines.map(l=>l.sub+" ("+l.cls.join(",")+")").join(" · ")}</small><small>${count(x)} periods a week</small></span><span class="ac"><button data-a="esc" data-v="${i}" aria-label="Edit">✎</button><button data-a="dsc" data-v="${i}" aria-label="Delete">✕</button></span></div>`).join("")||'<p class="mu">No schedules yet.</p>'}
  <button class="btn o" style="margin-top:6px" data-a="asc">+ Add schedule</button></section>
 <section class="panel"><p class="lbl">Device backup <span>required</span></p>
  <p class="mu">Cloud backup is disabled. Choose a folder on this device; Rochma will save and restore backups only in that folder. Folder access is requested again if permission is missing or revoked.</p>
  <button class="btn o" style="width:100%;margin:8px 0" data-a="folder">${backupDir?'Change backup folder':'Choose backup folder'}</button>
  ${err?`<p class="err">${esc(err)}</p>`:""}
  <button class="btn" style="width:100%;margin-top:4px" data-a="save" ${ok?"":"disabled"}>${busy||(d.schedules.length?"Save profile backup":"Add a schedule to continue")}</button>
  <p class="mu" style="margin:8px 0 0">Your working profile remains in this browser. Backup files are written only to the folder you select.</p></section>
 <section class="panel"><p class="lbl">Restore</p><div class="row"><button class="btn o" data-a="rfile">Restore from chosen folder</button>${P?`<button class="btn d" data-a="del">Delete profile</button>`:""}</div>
  <p class="mu" style="margin:8px 0 0">Restores the Rochma JSON backup from your selected folder. No cloud backup or cloud restore is available.</p></section></div>`}

/* ---------- render ---------- */
function render(){
 $("ttl").textContent=st.tab==="home"?(P&&P.name?"Hello, "+P.name:"Today"):"Explore";
 $("v").innerHTML=st.tab==="home"?homeView():exploreView();
 $("tabs").innerHTML=`<button data-a="tab" data-v="home" ${st.tab==="home"?'aria-current="page"':""}><b>◔</b>Today</button><button data-a="tab" data-v="explore" ${st.tab==="explore"?'aria-current="page"':""}><b>⌕</b>Explore</button><button data-a="edit"><b>☺</b>${P?"Profile":"Set up"}</button>`;
 $("thm").textContent="Theme: "+theme;
 const r=document.documentElement;theme==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",theme);
 if(E)drawSheet()}
function drawSheet(){const s=$("sheet"),y=s.scrollTop;s.hidden=false;s.innerHTML=sheetView();s.scrollTop=y}
let tt;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2600)}
const cloneSc=x=>({...x,days:[...x.days],shift:{...x.shift},lines:x.lines.map(l=>({sub:l.sub,cls:[...l.cls]}))});
function openSheet(){E={name:P?P.name:"",schedules:P?P.schedules.map(cloneSc):[],sc:null,ed:-1,ps:new Set(),pc:new Set(),backup:P&&P.backup&&P.backup.kind!=="import"?P.backup.kind:null};err="";busy="";drawSheet()}
function closeSheet(){E=null;$("sheet").hidden=true;render()}

/* ---------- device-folder backup (File System Access API) ---------- */
const HANDLE_DB="rochma-device-backup",HANDLE_STORE="handles",HANDLE_KEY="backup-directory";
function openHandleDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(HANDLE_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(HANDLE_STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error("Could not access local folder settings."))})}
async function saveHandle(handle){const db=await openHandleDb();return new Promise((resolve,reject)=>{const tx=db.transaction(HANDLE_STORE,"readwrite");tx.objectStore(HANDLE_STORE).put(handle,HANDLE_KEY);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function loadHandle(){const db=await openHandleDb();return new Promise((resolve,reject)=>{const r=db.transaction(HANDLE_STORE,"readonly").objectStore(HANDLE_STORE).get(HANDLE_KEY);r.onsuccess=()=>{db.close();resolve(r.result||null)};r.onerror=()=>{db.close();reject(r.error)}})}
async function chooseBackupFolder(){
 if(!window.showDirectoryPicker)throw new Error("This browser does not support folder access. Open Rochma in a supported browser over HTTPS.");
 const handle=await window.showDirectoryPicker({id:"rochma-backup-folder",mode:"readwrite"});
 const permission=await handle.requestPermission({mode:"readwrite"});
 if(permission!=="granted")throw new Error("Read/write permission was not granted. Select a folder and allow access to continue.");
 await saveHandle(handle);backupDir=handle;return handle;
}
async function ensureBackupFolder(){
 let handle=backupDir;
 if(!handle)try{handle=await loadHandle()}catch(e){}
 if(handle){try{let p=await handle.queryPermission({mode:"readwrite"});if(p!=="granted")p=await handle.requestPermission({mode:"readwrite"});if(p==="granted"){backupDir=handle;return handle}}catch(e){}}
 return await chooseBackupFolder();
}
async function backupToFolder(json){
 const dir=await ensureBackupFolder();
 const file=await dir.getFileHandle(FILE,{create:true});
 const writable=await file.createWritable();
 try{await writable.write(json);await writable.close()}catch(e){try{await writable.abort()}catch(x){}throw e}
}
async function readBackupFromFolder(){
 const dir=await ensureBackupFolder();
 let file;try{file=await dir.getFileHandle(FILE)}catch(e){if(e&&e.name==="NotFoundError")throw new Error("No Rochma backup was found in that folder. Save a profile first.");throw e}
 return await (await file.getFile()).text();
}
async function save(){
 const d=E;err="";busy="Saving…";drawSheet();
 const p=normalize({name:d.name.trim(),schedules:d.schedules});
 if(!p){busy="";err="Check your schedules and shift hours.";return drawSheet()}
 const prev=P;P=p;
 if(!persist()){P=prev;busy="";err="Browser storage is unavailable, so the profile can’t be kept.";return drawSheet()}
 try{await backupToFolder(payload());P.backup={kind:"device-folder",at:Date.now()};persist();closeSheet();toast("Profile saved to chosen folder")}
 catch(e){busy="";err=(e&&e.message||"Backup failed.")+" Choose a folder and grant read/write access to finish.";drawSheet();render()}}
function adopt(raw,src){
 let p=null;try{p=normalize(JSON.parse(raw))}catch(e){}
 if(!p){err="That file isn’t a valid Rochma profile backup.";if(E)drawSheet();return false}
 P={...p,updated:Date.now(),backup:{kind:src,at:Date.now()}};persist();closeSheet();toast("Profile restored");return true}
async function restoreFolder(){
 try{const raw=await readBackupFromFolder();adopt(raw,"device-folder")}
 catch(e){err=e&&e.message||"Couldn’t read the backup from the chosen folder.";drawSheet()}}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b||b.tagName==="INPUT")return;const a=b.dataset.a,v=b.dataset.v;
 switch(a){
  case"tab":st.tab=v;break;
  case"hday":st.hd=st.hd===v?null:v;break;
  case"theme":theme=THEMES[(THEMES.indexOf(theme)+1)%3];try{localStorage.setItem("rochma-theme",theme)}catch(x){}break;
  case"lvAll":st.lv.clear();st.cls.clear();break;
  case"lv":{const i=+v,g=GROUPS[i];if(st.lv.has(i)){st.lv.delete(i);g.c.forEach(c=>st.cls.delete(c))}else st.lv.add(i);break}
  case"cls":tog(st.cls,+v);break;
  case"day":tog(st.day,v);break;case"dayAll":st.day.clear();break;
  case"sub":tog(st.sub,v);break;case"subAll":st.sub.clear();break;
  case"mine":st.mine=!st.mine;break;
  case"g":st.g=v;break;
  case"tnow":{const k=clock();st.t=k.hm;if(k.day)st.day=new Set([k.day]);break}
  case"tclr":st.t="";break;
  case"edit":openSheet();return;
  case"close":closeSheet();return;
  case"asc":E.sc={label:"",days:new Set(),s:"07:30",e:"15:30",lines:[]};E.ed=-1;E.ps=new Set();E.pc=new Set();err="";return drawSheet();
  case"esc":{const x=E.schedules[+v];E.sc={label:x.label,days:new Set(x.days),s:x.shift.s,e:x.shift.e,lines:x.lines.map(l=>({sub:l.sub,cls:[...l.cls]}))};E.ed=+v;E.ps=new Set();E.pc=new Set();err="";return drawSheet()}
  case"dsc":if(confirm("Delete this schedule?")){E.schedules.splice(+v,1);drawSheet()}return;
  case"scancel":E.sc=null;err="";return drawSheet();
  case"sday":tog(E.sc.days,v);return drawSheet();
  case"psub":tog(E.ps,v);return drawSheet();
  case"pcls":tog(E.pc,+v);return drawSheet();
  case"addline":{const c=[...E.pc].sort((x,y)=>x-y);
   E.ps.forEach(sub=>{const l=E.sc.lines.find(x=>x.sub===sub);if(l)l.cls=[...new Set([...l.cls,...c])].sort((x,y)=>x-y);else E.sc.lines.push({sub,cls:[...c]})});
   E.ps.clear();E.pc.clear();err="";return drawSheet()}
  case"rmline":E.sc.lines.splice(+v,1);return drawSheet();
  case"sdone":{const x=E.sc;
   if(!x.lines.length){err="Add at least one subject with its classes.";return drawSheet()}
   if(!TIME.test(x.s)||!TIME.test(x.e)||x.s>=x.e){err="Shift end must be later than shift start.";return drawSheet()}
   const o={id:"s"+Date.now(),label:x.label.trim()||"Schedule "+(E.ed<0?E.schedules.length+1:E.ed+1),days:DAYS.filter(d=>x.days.has(d)),shift:{s:x.s,e:x.e},lines:x.lines};
   if(E.ed<0)E.schedules.push(o);else E.schedules[E.ed]=o;E.sc=null;err="";return drawSheet()}
  case"folder":return chooseBackupFolder().then(()=>{err="";toast("Backup folder selected");drawSheet()}).catch(e=>{err=e&&e.message||"Could not select backup folder.";drawSheet()});
  case"save":return save();
  case"rfile":return restoreFolder();
  case"del":if(confirm("Delete your profile from this browser? Backups are not deleted.")){P=null;try{localStorage.removeItem(KEY)}catch(x){}closeSheet();toast("Profile deleted")}return;
 }
 render()});
document.addEventListener("input",e=>{const a=e.target.dataset.a;if(!E)return;if(a==="name")E.name=e.target.value;if(a==="lbl"&&E.sc)E.sc.label=e.target.value});
document.addEventListener("change",e=>{const a=e.target.dataset.a,v=e.target.value;
 if(a==="time"){st.t=v;render()}
 else if(a==="ss"&&E&&E.sc){E.sc.s=v;drawSheet()}
 else if(a==="se"&&E&&E.sc){E.sc.e=v;drawSheet()}});

setInterval(()=>{if(st.tab==="home"&&!E)render()},60000);
render();
(async()=>{try{backupDir=await loadHandle()}catch(e){backupDir=null}})();
</script>
</body>
</html>
